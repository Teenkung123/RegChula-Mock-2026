---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-boundary
  namespace: regchula
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: regchula-api
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: regchula-web
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: regchula-staff
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: regchula-mysql
      ports:
        - protocol: TCP
          port: 3306
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: regchula-redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
