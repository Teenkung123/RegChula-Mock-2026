apiVersion: v1
kind: Service
metadata:
  name: regchula-redis
  namespace: regchula
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: regchula-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: regchula-redis
  namespace: regchula
spec:
  serviceName: regchula-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: regchula-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: regchula-redis
        app.kubernetes.io/part-of: regchula
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - exec redis-server --appendonly yes --appendfsync everysec --maxmemory 768mb --maxmemory-policy noeviction --requirepass "$REDIS_PASSWORD"
          envFrom:
            - secretRef:
                name: regchula-redis
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
          startupProbe:
            exec:
              command: ["/bin/sh", "-c", 'redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG']
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", 'redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG']
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", 'redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG']
            periodSeconds: 15
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: regchula-redis
  namespace: regchula
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: regchula-redis
