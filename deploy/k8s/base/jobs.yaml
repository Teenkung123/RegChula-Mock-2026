apiVersion: batch/v1
kind: Job
metadata:
  name: regchula-bootstrap
  namespace: regchula
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: regchula-maintenance
        app.kubernetes.io/part-of: regchula
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: regchula-api:local
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - bun apps/api/src/cli/migrate.ts && bun apps/api/src/cli/catalog-import.ts
          envFrom:
            - secretRef:
                name: regchula-runtime
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: regchula-auth-cleanup
  namespace: regchula
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: regchula-maintenance
            app.kubernetes.io/part-of: regchula
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: auth-cleanup
              image: regchula-api:local
              imagePullPolicy: IfNotPresent
              command: ["bun", "apps/api/src/cli/auth-state-cleanup.ts"]
              envFrom:
                - secretRef:
                    name: regchula-runtime
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 32Mi
