apiVersion: v1
kind: Service
metadata:
  name: regchula-mysql
  namespace: regchula
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: regchula-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: regchula-mysql
  namespace: regchula
spec:
  serviceName: regchula-mysql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: regchula-mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: regchula-mysql
        app.kubernetes.io/part-of: regchula
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql
          image: mysql:8.4
          imagePullPolicy: IfNotPresent
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_0900_ai_ci
            - --skip-name-resolve
            - --max-connections=160
          envFrom:
            - secretRef:
                name: regchula-mysql
          ports:
            - name: mysql
              containerPort: 3306
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
          startupProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 15
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: regchula-mysql
  namespace: regchula
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: regchula-mysql
