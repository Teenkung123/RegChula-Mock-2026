apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: regchula-api
  namespace: regchula
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: regchula-api
  minReplicas: 3
  maxReplicas: 8
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: regchula-web
  namespace: regchula
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: regchula-web
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
