worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 16384;
}

http {
  error_log /dev/stderr warn;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  keepalive_timeout 30;
  client_max_body_size 64k;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  limit_req_zone $binary_remote_addr zone=challenge:10m rate=300r/s;
  limit_req_zone $binary_remote_addr zone=login:10m rate=250r/s;

  upstream regchula_api {
    keepalive 128;
    server regchula-api:3000;
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /api/v1/auth/challenge {
      include /etc/nginx/security-headers.conf;
      limit_req zone=challenge burst=600 nodelay;
      proxy_pass http://regchula_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      add_header Cache-Control "private, no-store" always;
    }

    location = /api/v1/auth/login {
      include /etc/nginx/security-headers.conf;
      limit_req zone=login burst=500 nodelay;
      proxy_pass http://regchula_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      add_header Cache-Control "private, no-store" always;
    }

    location /api/ {
      include /etc/nginx/security-headers.conf;
      proxy_pass http://regchula_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      add_header Cache-Control "private, no-store" always;
    }

    location /openapi {
      include /etc/nginx/security-headers.conf;
      proxy_pass http://regchula_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      add_header Cache-Control "no-store" always;
    }

    location /assets/ {
      include /etc/nginx/security-headers.conf;
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location / {
      include /etc/nginx/security-headers.conf;
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache";
    }
  }
}
